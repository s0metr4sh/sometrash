<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sometrash</title>
    <link href="/img/nutrash.ico" rel="icon" type="image/x-icon">
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">   
  </head>
  <body>
  <br />
  <div id="box">
    <div id="desktop" class="display">
    <br />
      <figure id="sometrashIcon" onClick="if (screen.width < 666){openSometrash()};" ondblclick="openSometrash();">
        <img src="/img/sprtrash.png" />
        <figcaption><span class="iconTitle">sometrash</span></figcaption>
      </figure>  
      <figure id="aboutIcon" onClick="if (screen.width < 666){openAbout()};" ondblclick="openAbout();">
        <img src="/img/sprabout.png" />
        <figcaption><span class="iconTitle">about</span></figcaption>
      </figure>
      <figure id="contactIcon" onClick="if (screen.width < 666){moveIcon(100)};" ondblclick="moveIcon(100);">
        <img src="/img/sprcontact.png" />
        <figcaption><span class="iconTitle">contact</span></figcaption>
      </figure>  
      <!--<figure id="oldsiteIcon" onClick="if (screen.width < 666){window.open('https://sometrash.neocities.org/oldindex.html')};" ondblclick="window.open('https://sometrash.neocities.org/oldindex.html');">
        <img src="/img/sproldsite.png" />
        <figcaption><span class="iconTitle">old_site</span></figcaption>
      </figure>-->
      <div id="aboutDialog">
        Mostly doodles that Im somewhat proud of and happy to share with anyone interested.<br /> Nothing AI generated or assisted. <br />Hope something does catch your eye, have fun <br /><img src="/img/sprhp.png" style="display:inline;" /><img src="/img/sprhp.png" style="display:inline;" /><img src="/img/sprhp.png" style="display:inline;" />
        <br /><button onClick="document.getElementById('aboutDialog').style.display='none';">Close</button>
      </div>
    </div>
    <div id="window" class="display">
      <div class="bar"><button onClick="document.getElementById('window').style.display='none'; document.getElementById('desktop').style.display='inline-block';" class="navButton">&#10005;</button><span class="title">sometrash/</span></div>
      <div id="windowContent"></div> 
    </div>
    <div id="windowItem" class="display">
      <div class="bar"><button onClick="document.getElementById('windowItem').style.display='none'; document.getElementById('window').style.display='inline-block';" class="navButton">&#10005;</button><span id="prevAndNext"></span><span class="title">/</span><span id="title"></span></div>
      <div id="windowItemContent" class="display"></div>
    </div>
  </div>
  <div id="preloadContent"></div>
  <script type="text/javascript" src="/script.js" ></script>
  </body>
</html>
